{% extends "base.html" %}

{% block title %}Thêm đề tài - Hệ thống Quản lý Khoa học Quân sự{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <a href="{{ url_for('main.detai_list') }}" class="btn btn-info">
        <i class="fas fa-arrow-left"></i> Quay lại
    </a>
</div>

<div class="card">
    <div class="card-header">
        <i class="fas fa-plus"></i> Thêm đề tài nghiên cứu mới
    </div>
    <div class="card-body">
        <form method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label class="form-label" for="ma_de_tai">Mã đề tài <span style="color: red;">*</span></label>
                    <input type="text" class="form-control" id="ma_de_tai" name="ma_de_tai" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="chu_nhiem">Chủ nhiệm đề tài <span style="color: red;">*</span></label>
                    <input type="text" class="form-control" id="chu_nhiem" name="chu_nhiem" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="ten_de_tai">Tên đề tài <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="ten_de_tai" name="ten_de_tai" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="mo_ta">Mô tả</label>
                <textarea class="form-control" id="mo_ta" name="mo_ta" rows="4"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label class="form-label" for="linh_vuc">Lĩnh vực</label>
                    <input type="text" class="form-control" id="linh_vuc" name="linh_vuc">
                </div>

                <div class="form-group">
                    <label class="form-label" for="don_vi">
                        <i class="fas fa-building"></i> Đơn vị {% if current_user.role != 'admin' %}<span style="color: red;">*</span>{% endif %}
                    </label>
                    {% if current_user.role == 'admin' %}
                    <select class="form-control" id="don_vi" name="don_vi">
                        <option value="">-- Chọn đơn vị --</option>
                        {% for nhom, danh_sach in don_vi_list.items() %}
                        <optgroup label="{{ nhom }}">
                            {% for don_vi in danh_sach %}
                            <option value="{{ don_vi }}">{{ don_vi }}</option>
                            {% endfor %}
                        </optgroup>
                        {% endfor %}
                    </select>
                    {% else %}
                    <input type="text" class="form-control" value="{{ current_user.don_vi }}" readonly style="background-color: #f0f0f0;">
                    <small class="form-text text-muted">Bạn chỉ có thể thêm đề tài cho đơn vị của mình</small>
                    {% endif %}
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label class="form-label" for="ngay_bat_dau">Ngày bắt đầu</label>
                    <input type="date" class="form-control" id="ngay_bat_dau" name="ngay_bat_dau">
                </div>

                <div class="form-group">
                    <label class="form-label" for="ngay_ket_thuc">Ngày kết thúc</label>
                    <input type="date" class="form-control" id="ngay_ket_thuc" name="ngay_ket_thuc">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label class="form-label" for="kinh_phi">Kinh phí (VNĐ)</label>
                    <input type="number" class="form-control" id="kinh_phi" name="kinh_phi" value="0" min="0">
                </div>

                <div class="form-group">
                    <label class="form-label" for="trang_thai">Trạng thái</label>
                    <select class="form-control" id="trang_thai" name="trang_thai">
                        <option value="Đang thực hiện">Đang thực hiện</option>
                        <option value="Hoàn thành">Hoàn thành</option>
                        <option value="Tạm dừng">Tạm dừng</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Lưu đề tài
                </button>
                <a href="{{ url_for('main.detai_list') }}" class="btn btn-danger">
                    <i class="fas fa-times"></i> Hủy bỏ
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
