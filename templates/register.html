{% extends "base.html" %}

{% block title %}Đăng ký - Hệ thống Quản lý Khoa học Quân sự{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card" style="max-width: 500px;">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
            <p>Hệ thống Quản lý Khoa học Quân sự</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user"></i> Tên đăng nhập
                </label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="full_name">
                    <i class="fas fa-id-card"></i> Họ và tên
                </label>
                <input type="text" class="form-control" id="full_name" name="full_name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="don_vi">
                    <i class="fas fa-building"></i> Đơn vị <span style="color: red;">*</span>
                </label>
                <select class="form-control" id="don_vi" name="don_vi" required>
                    <option value="">-- Chọn đơn vị --</option>
                    {% for nhom, danh_sach in don_vi_list.items() %}
                    <optgroup label="{{ nhom }}">
                        {% for don_vi in danh_sach %}
                        <option value="{{ don_vi }}">{{ don_vi }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock"></i> Mật khẩu
                </label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">
                    <i class="fas fa-lock"></i> Xác nhận mật khẩu
                </label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fas fa-user-plus"></i> Đăng ký
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: #666;">
            <p>Đã có tài khoản? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Đăng nhập ngay</a></p>
        </div>
    </div>
</div>
{% endblock %}
